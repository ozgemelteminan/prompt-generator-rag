[project]
name = "promptforge-prompt-engine"
version = "0.1.0"
description = "Provider-independent PromptForge prompt-engine domain models"
requires-python = ">=3.12"
dependencies = ["pydantic>=2.7,<3"]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
