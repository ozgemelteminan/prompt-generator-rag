[project]
name = "promptforge-api"
version = "0.1.0"
description = "PromptForge API foundation"
requires-python = ">=3.12"
dependencies = [
  "alembic>=1.14,<2",
  "fastapi>=0.115,<1",
  "openai>=1.57,<3",
  "psycopg[binary]>=3.2,<4",
  "promptforge-prompt-engine",
  "pypdf>=5,<7",
  "python-multipart>=0.0.18,<1",
  "python-docx>=1.1,<2",
  "pydantic-settings>=2.7,<3",
  "sqlalchemy>=2.0,<3",
  "sentence-transformers>=5.6,<6",
  "uvicorn[standard]>=0.32,<1",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app*"]

[tool.uv.sources]
promptforge-prompt-engine = { path = "../../packages/prompt-engine", editable = true }

[dependency-groups]
dev = [
  "httpx>=0.28,<1",
  "pytest>=8.3,<9",
  "ruff>=0.8,<1",
]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
